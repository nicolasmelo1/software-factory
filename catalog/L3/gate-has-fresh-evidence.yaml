id: L3.GATE_HAS_FRESH_EVIDENCE
layer: L3
title: A gate activated by touched paths needs digest-verified, non-stale evidence
severity: critical
statement: >-
  When a change touches a gate's activation paths, that gate's evidence
  manifest must exist, its referenced report must match the recorded SHA-256,
  every required assertion must be `passed` with none `unsupported`, and the
  digest of the implementation it certifies must still match the code on disk.
why: >-
  This is the whole method in one check. Activation comes from touched paths,
  so nobody can skip the gate by omitting a label or writing "done" in a pull
  request. The manifest is not trusted, it is re-verified, so a summary cannot
  claim a pass the raw report never contained. And the implementation digest is
  what makes evidence expire: change the code the evidence certified and the
  evidence dies with it, instead of quietly certifying something it never saw.
fix: >-
  Re-run the proof against the real thing and regenerate the manifest with
  `sf seal <gate>`. If the run cannot pass, the finding is the product
  behaviour, not the gate. Never hand-edit a digest.
ratchet: none
check:
  kind: evidence
defaults:
  forbidden_in_goal:
    - "/Users/"
    - "/home/"
    - "src/"
    - "tests/fixtures/"
