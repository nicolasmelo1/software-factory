id: L5.NO_INERT_RULE
layer: L5
title: An enabled rule must be capable of producing a finding
severity: high
statement: >-
  A rule that is switched on must be configured to look at something: a lock
  rule needs a scope, a toolchain rule needs tools, a gate rule needs a gate,
  a text-pattern or complexity rule needs a scope that actually selects a
  file it can evaluate, and a rule carrying a `when` needs a manifest that
  still satisfies it.
why: >-
  `sf verify` proves a rule *can* fire, by running it against a fixture built
  to trip it. It says nothing about whether the rule is pointed at anything in
  *this* repository. An enabled lock with an empty scope, or a hazard rule
  with no tools declared, passes every run forever and appears in every
  report as a rule that found nothing — indistinguishable from a rule that is
  protecting you. This was not hypothetical: the tool's own scaffolding wrote
  an empty scope over a critical lock, and nothing noticed until the lock
  file failed to appear. The same blindness reaches a text-pattern or
  complexity rule: a scope glob that matches no file in the repository, or a
  declared language none of its files ever resolve to, leaves the rule
  enabled and silent forever. This was also not hypothetical — a repository
  that declared `languages: [typescript]` while containing zero `.ts` files
  ran its complexity ceiling and its suppression bans over 365,133 lines and
  reported nothing, and nothing here noticed until this rule was taught to
  look. A `toolchain` rule has the same hole in a quieter form: `tools:` is a
  map, so it can be non-empty and still miss the one language the adopting
  project declares — `checks::toolchain::run` skips a declared language it
  has no entry for with a bare `continue`, not a finding. This was also not
  hypothetical: a Ruby-only adoption enabled `L6.DATA_RACES_ARE_DETECTED`,
  `L6.DEAD_CODE_IS_DETECTED` and `L6.PERFORMANCE_REGRESSION_IS_GUARDED`, whose
  `tools:` maps carry python, typescript, go and rust and no `ruby:` key, and
  got three permanent green checkmarks that could never have said anything
  else — `sf verify` reported all three proven to fire and never mentioned
  that the project's own language was invisible to them. The last shape is
  the one a repository walks into without editing a line of policy: a rule
  written for one version of a dependency, carrying a `when` that names it,
  after somebody moved the pin. Its patterns then describe an API nobody
  calls anymore, and a text-pattern rule matching nothing reads exactly like
  a text-pattern rule protecting you. A condition that went false stops the
  rule running — it is about a version this repository does not have — and
  is reported here rather than quietly disabling itself, which is also what
  stops `when` becoming a way to switch a rule off by editing a manifest.
fix: >-
  Give the rule something to look at, or switch it off in policy and say why in
  the rules document. Disabled and documented is honest; enabled and inert is
  a rule that lies about its own coverage. A rule whose `when` went false is
  the one case with nothing to configure: repoint it at the version this
  repository installs, or remove it along with the version it described.
ratchet: none
check:
  kind: cadence
  mode: inert_rules
defaults: {}
