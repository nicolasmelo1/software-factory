id: L6.SECRETS_ARE_SCANNED
layer: L6
title: Something scans for committed secrets
severity: critical
statement: >-
  A secret scanner runs somewhere the repository actually executes.
why: >-
  A leaked credential is the one class of defect that cannot be fixed by a
  revert: once it is in the history it is compromised, and the remedy is
  rotation under time pressure. Agents produce this failure in a specific way —
  they inline a working value while debugging, then write the config
  indirection afterwards, and the debugging commit is already pushed. The scan
  is cheap and it is the only check here whose absence is unrecoverable.
fix: >-
  Wire in `detect-secrets`, `gitleaks` or `trufflehog`. Scanners are mostly
  language-independent, so one covers the whole repository.
ratchet: allowlist
check:
  kind: toolchain
defaults:
  scope:
    - ".github/workflows/**"
    - ".gitlab-ci.yml"
    - ".pre-commit-config.yaml"
    - "Makefile"
    - "justfile"
    - "Taskfile.yml"
    - "package.json"
  tools:
    python: ["detect-secrets", "gitleaks", "trufflehog"]
    typescript: ["detect-secrets", "gitleaks", "trufflehog"]
    go: ["detect-secrets", "gitleaks", "trufflehog"]
    rust: ["detect-secrets", "gitleaks", "trufflehog"]
    ruby: ["detect-secrets", "gitleaks", "trufflehog"]
