id: L6.URLS_ARE_DECODED_BY_THE_PLATFORM
layer: L6
title: A file URL is converted by the platform's own decoder
severity: high
statement: >-
  A `file:` URL in source is decoded by the platform's URL library —
  `fileURLToPath` in JavaScript, `url.URL.Path` in Go — never by hand. This
  rule fires on the manual shapes: `decodeURIComponent` applied to a
  `file:` string, and string surgery on a `file:` URL — slicing off the
  `file://` prefix, or stripping the host segment to recover a path.
why: >-
  A file URL is not a path with a prefix; it is a URL, and the difference
  is not cosmetic. Percent-encoded characters (`%20` for a space, `%25`
  for the percent itself), a Windows drive letter the host segment of the
  URL swallows (`file:///C:/x` carries an empty host and `C:` inside the
  path, `file://C:/x` carries `C:` as the host), UNC paths the host field
  was made for, and a leading `//` on POSIX that makes the sliced result a
  network path — each of these silently corrupts a hand decode in a
  different way, and none of them shows up on the machine the decoder was
  written on. The review loop that found this shipped a hand decode, a
  reviewer caught the drive letter, the repair caught the escapes, and the
  shape survived three more rounds because each repair fixed one letter of
  one case. The platform decoder is right because it is the one every
  consumer of the URL already agrees with; anything else disagrees with
  the import that is about to run on the result.
fix: >-
  Call the platform's own converter: `fileURLToPath(url)` from
  `node:url` in JavaScript (and `pathToFileURL` for the way back), or
  `(&url.URL{...}).Path` / `filepath.FromSlash` in Go. If the platform has
  no converter, that is the finding — the code is about to disagree with
  every runtime that does.
ratchet: allowlist
check:
  kind: text_pattern
defaults:
  scope:
    - "**/*.js"
    - "**/*.mjs"
    - "**/*.cjs"
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.go"
  forbidden:
    # decodeURIComponent anywhere on a line that also carries a file: URL.
    - regex: 'decodeURIComponent\([^)]*\)[^;]*file:|"file:|`file:'
      unless: 'fileURLToPath'
      message: "decodeURIComponent over a file: URL decodes it as form text, not as a file URL — percent escapes and the host segment are both wrong. Use fileURLToPath."
    # String surgery on the file:// prefix.
    - regex: '(replace|slice|substring|substr|split)\([^)]*\)[^;]*file://|file://[^"''`]*\.(replace|slice|substring|split)\('
      message: "Slicing the file:// prefix off a URL is not decoding it. Use fileURLToPath, which the platform wrote for exactly this."
    # Stripping a file: scheme by hand to make a path.
    - regex: '^\s*.{0,40}(path|dir|file)\w*\s*=\s*["''`]?\w*[uU]rl\w*\.(replace|slice|substring)\('
      message: "A path derived from a URL by string surgery disagrees with the platform about escapes, hosts and drive letters. Use fileURLToPath."