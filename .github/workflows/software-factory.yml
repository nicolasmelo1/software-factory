name: software factory

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # This repository builds sf from source rather than installing it: the
      # thing under test must be the thing in the diff.
      - name: Build
        run: cargo build --release --locked
      - name: Prove every check still fires
        run: ./target/release/sf verify
      - name: Check this repository against its own rules
        run: ./target/release/sf check
