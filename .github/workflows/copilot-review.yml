name: copilot review

# Every pull request from a branch of this repository is read by Copilot before
# it is read by a person, and the repository is what asks — not the person
# opening it, who is the one least likely to remember and the one whose work it
# is.
#
# This is a workflow rather than the repository setting that does the same
# thing, for the reason everything else here is in a file: a setting lives in
# a web page nobody diffs, and the day it is switched off the pull requests
# that stopped being reviewed look exactly like the ones that were.
#
# **A fork's pull request is not covered, deliberately.** `pull_request` hands
# a fork a read-only token, so the request would 403 rather than happen. The
# mechanism that would cover it is `pull_request_target`, which runs with this
# repository's write token — and which `zizmor`, in the `hazards` job, reports
# as high severity for the whole class. Nothing here checks out or executes the
# pull request's code, so the exception would be defensible and it would still
# be an exception written into the one file whose job is to refuse them. A fork
# is reviewed when somebody with write access pushes the branch, which is also
# the moment it becomes this repository's problem.

on:
  pull_request:
    # `synchronize` is every push to an open pull request, which is the point:
    # a review of the first commit says nothing about the fourth, and the
    # commit somebody adds after a review is the one nobody looks at twice.
    # Re-requesting a reviewer who has already answered asks for a fresh
    # review, so each push is read.
    types: [opened, reopened, ready_for_review, synchronize]
    # Against main only. A stacked pull request aimed at another branch is
    # read when it is rebased onto this one.
    branches: [main]

# One request per pull request at a time. Three commits pushed in a row are
# three events, and without this they are three reviews of a tree that only
# ever mattered as it stands after the last of them.
concurrency:
  group: copilot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The whole file needs one permission, and requesting a review is all it can
# do with it. `contents` is not here on purpose: nothing is checked out.
permissions:
  pull-requests: write

jobs:
  request:
    runs-on: ubuntu-latest
    # Skipped rather than failed: a fork's token cannot request a review, and
    # a red job on every outside contribution would teach everybody to ignore
    # a red job. The header says what that costs. A draft is skipped too, and
    # asked for by `ready_for_review` — the moment somebody wanted eyes on it.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
    steps:
      # `@copilot` is what the CLI takes; the API underneath it wants
      # `copilot-pull-request-reviewer[bot]`. Every value it reads arrives as
      # an environment variable rather than as `${{ }}` inside the script,
      # because an expression expanded into a shell is the injection this
      # repository's workflow scanner exists to refuse.
      - name: Ask Copilot for a review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: gh pr edit "$PULL_REQUEST" --repo "$REPOSITORY" --add-reviewer @copilot
